{% extends 'base.html' %}

{% block title %}Customer Accounts - {{ block.super }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Customer Accounts</h1>
    <ul>
        {% for account in customer_accounts %}
            <li>{{ account }}</li>
        {% empty %}
            <li>No customer accounts found.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
