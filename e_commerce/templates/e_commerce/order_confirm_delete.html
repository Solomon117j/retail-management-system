{% extends "base.html" %}

{% block content %}
<h1>Delete Online Order</h1>
<p>Are you sure you want to delete Online Order #{{ object.id }}?</p>
<form method="post">
    {% csrf_token %}
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-danger">Confirm Delete</button>
        <a href="{% url 'ecommerce:order_detail' object.pk %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
