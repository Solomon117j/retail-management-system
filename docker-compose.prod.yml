version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    env_file:
      - .env.production
    depends_on:
      - db
    command: gunicorn retail_management_system.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120

  db:
    image: postgres:15
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/ssl/certs:ro
      - staticfiles:/app/staticfiles
      - media:/app/media
    depends_on:
      - web

volumes:
  postgres_data:
  staticfiles:
  media:
