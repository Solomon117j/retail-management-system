{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Sales Orders</h1>
        <a href="{% url 'sales:sale_create' %}" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>Create New Sale
        </a>
    </div>

    <!-- Date Filter Form -->
    <form method="get" class="card mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" name="start_date" class="form-control" value="{{ request.GET.start_date }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">End Date</label>
                    <input type="date" name="end_date" class="form-control" value="{{ request.GET.end_date }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">&nbsp;</label>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-filter me-1"></i>Filter by Date
                    </button>
                </div>
                <div class="col-md-3">
                    <label class="form-label">&nbsp;</label>
                    <a href="{% url 'sales:sale_list' %}" class="btn btn-outline-secondary w-100">
                        <i class="fas fa-times me-1"></i>Clear
                    </a>
                </div>
            </div>
        </div>
    </form>

    <!-- HTMX Status Filter Buttons -->
    <div class="mb-4">
        <div class="btn-group btn-group-sm" role="group">
            <button type="button" class="btn btn-outline-secondary" 
                    hx-get="{% url 'sales:sale_list' %}"
                    hx-target="#sales-table-container"
                    hx-swap="outerHTML"
                    title="All Sales">
                <i class="fas fa-list me-1"></i>All
            </button>
            <button type="button" class="btn btn-outline-info"
                    hx-get="{% url 'sales:sale_list' %}?status=pending"
                    hx-target="#sales-table-container"
                    hx-swap="outerHTML"
                    title="Pending Sales">
                <i class="fas fa-hourglass me-1"></i>Pending
            </button>
            <button type="button" class="btn btn-outline-success"
                    hx-get="{% url 'sales:sale_list' %}?status=completed"
                    hx-target="#sales-table-container"
                    hx-swap="outerHTML"
                    title="Completed Sales">
                <i class="fas fa-check me-1"></i>Completed
            </button>
            <button type="button" class="btn btn-outline-danger"
                    hx-get="{% url 'sales:sale_list' %}?status=cancelled"
                    hx-target="#sales-table-container"
                    hx-swap="outerHTML"
                    title="Cancelled Sales">
                <i class="fas fa-times me-1"></i>Cancelled
            </button>
        </div>
    </div>

    <!-- Sales Table Fragment -->
    <div class="card">
        <div class="card-body p-0">
            {% include 'partials/sales_table_fragment.html' %}
        </div>
    </div>
</div>
{% endblock %}
