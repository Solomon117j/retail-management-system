{% extends "base.html" %}
{% block content %}
<h1>Delete Brand</h1>
<p>Are you sure you want to delete the brand "{{ object.name }}"?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Yes, Delete</button>
  <a href="{% url 'inventory:brand_list' %}">Cancel</a>
</form>
{% endblock %}
