{% extends 'base.html' %}
{% load static %}

{% block title %}Adjust Stock — {{ block.super }}{% endblock %}

{% block content %}
<div class="container mt-4">
  <h1 class="h4 mb-3"><i class="fas fa-sliders-h me-2"></i>Adjust Stock</h1>
  <div class="card">
    <div class="card-body">
      <form method="post" class="row g-3">
        {% csrf_token %}
        <div class="col-md-6">
          <label class="form-label">Product</label>
          {{ form.product }}
        </div>
        <div class="col-md-6">
          <label class="form-label">Store</label>
          {{ form.store }}
        </div>
        <div class="col-md-6">
          <label class="form-label">Quantity delta</label>
          {{ form.quantity }}
          <div class="form-text">Use positive to add, negative to subtract</div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Note</label>
          {{ form.note }}
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Save</button>
          <a href="{% url 'inventory:stock_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
