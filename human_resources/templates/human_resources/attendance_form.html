{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-4">
    {% if object %}Edit Attendance{% else %}Create Attendance Record{% endif %}
  </h2>
  
  <form method="post">
    {% csrf_token %}
    
    <div class="card mb-4">
      <div class="card-body">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="id_employee">Employee</label>
              {{ form.employee }}
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="id_date">Date</label>
              {{ form.date }}
            </div>
          </div>
        </div>
        
        <div class="row">
          <div class="col-md-3">
            <div class="form-group">
              <label for="id_clock_in">Clock In</label>
              {{ form.clock_in }}
            </div>
          </div>
          <div class="col-md-3">
            <div class="form-group">
              <label for="id_clock_out">Clock Out</label>
              {{ form.clock_out }}
            </div>
          </div>
          <div class="col-md-3">
            <div class="form-group">
              <label for="id_status">Status</label>
              {{ form.status }}
            </div>
          </div>
        </div>
        
        <div class="form-group">
          <label for="id_notes">Notes</label>
          {{ form.notes }}
        </div>
      </div>
    </div>
    
    <button type="submit" class="btn btn-primary">
      {% if object %}Update{% else %}Create{% endif %}
    </button>
    <a href="{% url 'hr:attendance_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
