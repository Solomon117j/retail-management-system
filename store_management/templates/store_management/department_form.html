{% extends "base.html" %}

{% block content %}
<h2>{% if object %}Edit Department{% else %}Create New Department{% endif %}</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'store_management:department_list' store_id=view.kwargs.store_id %}" 
       class="btn btn-secondary">Cancel</a>
</form>
{% endblock content %}
