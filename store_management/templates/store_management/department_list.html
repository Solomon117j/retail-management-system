{% extends "base.html" %}

{% block content %}
<h1>Departments for {{ store.store_name }}</h1>

<ul>
    {% for department in departments %}
    <li>{{ department.department_name }} - {{ department.description }}</li>
    {% endfor %}
</ul>

<a href="{% url 'store_management:department_create' store_id=store.store_id %}" 
   class="btn btn-primary">Add Department</a>
{% endblock content %}
