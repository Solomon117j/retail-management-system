{% extends "base.html" %}

{% block content %}
<h1>Delete Purchase Order</h1>
<p>Are you sure you want to delete Purchase Order #{{ object.id }}?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
    <a href="{% url 'procurement:purchaseorder_detail' object.pk %}">Cancel</a>
</form>
{% endblock %}
