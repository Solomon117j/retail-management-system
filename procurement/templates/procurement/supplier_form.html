{% extends "base.html" %}

{% block content %}
<h1>{% if object %}Edit{% else %}Create{% endif %} Supplier</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a href="{% if object %}{% url 'procurement:supplier_detail' object.pk %}{% else %}{% url 'procurement:supplier_list' %}{% endif %}">Cancel</a>
</form>
{% endblock %}
