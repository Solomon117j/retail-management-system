{% extends "base.html" %}

{% block content %}
<h1>Delete Supplier Product</h1>
<p>Are you sure you want to delete "{{ object }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
    <a href="{% url 'procurement:supplier_detail' object.supplier.pk %}">Cancel</a>
</form>
{% endblock %}
